# Dependency bots (Renovate, Dependabot) can't rebuild the committed dist/ bundle, so their PRs
# fail the dist freshness check. For bot PRs opened from branches in this repo (never forks),
# rebuild dist/ and commit it back to the PR branch.
#
# The build runs dependency code, so it gets a read-only token and no persisted credentials.
# A separate job with write access commits the result without running any repo code.
#
# Pushes made with GITHUB_TOKEN don't trigger workflows, so the commit job dispatches the
# workflows that report required checks against the new head commit.
name: Rebuild dist/ for bot PRs

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: rebuild-dist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild-dist:
    if: >-
      contains(fromJSON('["renovate[bot]", "dependabot[bot]"]'), github.event.pull_request.user.login) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Check for dist/ changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            git status --porcelain dist/
            # tar keeps file modes and lets the commit job mirror deletions
            tar -cf dist.tar dist
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist.tar
          retention-days: 1
          if-no-files-found: error

  commit-dist:
    needs: rebuild-dist
    if: needs.rebuild-dist.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the rebuilt dist/
      actions: write # dispatch the required-check workflows
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ runner.temp }}

      - name: Commit and push dist/
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist
          tar -xf "$RUNNER_TEMP/dist.tar"
          git add -A dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild dist/"
          # Not a force push: if the bot moved the branch meanwhile, this fails and the new
          # head gets its own run.
          git push origin "HEAD:refs/heads/$HEAD_REF"
          gh workflow run ci.yml --ref "$HEAD_REF"
